ci:
  collect:
    # o mesmo dist/ que o playwright e o lychee verificam: um build, quatro portões
    staticDistDir: ./dist
    numberOfRuns: 3

  assert:
    assertions:
      # A pontuação de performance mede sobretudo a máquina. As mesmas três
      # passagens deram 0.92/0.94/0.96 num portátil e 0.63/0.65/0.66 num runner
      # partilhado do GitHub — 30 pontos de diferença sem uma linha de código
      # mudar. Travar merges com este número seria travar o runner, não
      # regressões, por isso fica em aviso: aparece no log, não bloqueia.
      # Os tamanhos reais do bundle vão no resumo do deploy.
      categories:performance: [warn, { minScore: 0.9, aggregationMethod: median }]

      # Estas três não dependem da velocidade da máquina e dão 1.0 tanto local
      # como no runner. É aqui que o portão trava: qualquer descida é regressão.
      categories:accessibility: [error, { minScore: 1 }]
      categories:best-practices: [error, { minScore: 1 }]
      categories:seo: [error, { minScore: 1 }]
