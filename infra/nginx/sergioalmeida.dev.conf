# /etc/nginx/sites-available/sergioalmeida.dev  (PRODUÇÃO)
# Servido apenas em localhost; o cloudflared liga aqui e a Cloudflare trata do HTTPS.

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name sergioalmeida.dev www.sergioalmeida.dev;

    root /var/www/sergioalmeida.dev/current;

    include snippets/sergioalmeida-common.conf;

    access_log /var/log/nginx/sergioalmeida.dev.access.log;
    error_log  /var/log/nginx/sergioalmeida.dev.error.log;
}
