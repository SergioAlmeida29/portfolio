# /etc/nginx/sites-available/sergioalmeida.dev
# Servido apenas em localhost; o cloudflared liga aqui e a Cloudflare trata do HTTPS.

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name sergioalmeida.dev www.sergioalmeida.dev;

    root /var/www/sergioalmeida.dev/html;
    index index.html;

    # IP real do visitante (vem do túnel Cloudflare, não do localhost)
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # SPA: qualquer rota desconhecida cai no index.html (react-router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # assets com hash no nome (Vite) -> cache longo e imutável
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # modelos 3D e afins
    location ~* \.(glb|gltf|hdr|ktx2|draco|bin)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # o index nunca deve ser cacheado agressivamente
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # cabeçalhos de segurança base
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/sergioalmeida.dev.access.log;
    error_log  /var/log/nginx/sergioalmeida.dev.error.log;
}
