# PR previews: /pr/<N>/ servido como SPA independente.
# Cada preview tem o seu próprio base path (Vite build com --base /pr/<N>/).
# Instalar em /etc/nginx/snippets/sergioalmeida-pr-previews.conf
# e incluir no bloco server do staging.

location ~ ^/pr/(\d+)/(.*)$ {
    alias /var/www/staging.sergioalmeida.dev/pr/$1/;
    try_files $2 $2/ /pr/$1/index.html;

    # assets com hash -> cache longo
    location ~ ^/pr/\d+/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
