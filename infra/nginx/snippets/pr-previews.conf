# PR previews: /pr/<N>/ servido a partir de /var/www/staging.sergioalmeida.dev/pr/<N>/
# Cada preview tem o seu próprio base path (Vite build com --base /pr/<N>/).

location ~ ^/pr/(\d+)$ {
    return 301 /pr/$1/;
}

location ^~ /pr/ {
    root /var/www/staging.sergioalmeida.dev;
    index index.html;

    # Assets com hash -> cache longo
    location ~* ^/pr/\d+/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: /pr/<N>/qualquer-rota -> /pr/<N>/index.html
    location ~ ^/pr/(\d+)/ {
        try_files $uri $uri/ /pr/$1/index.html =404;
    }
}
