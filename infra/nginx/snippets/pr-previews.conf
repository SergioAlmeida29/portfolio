# PR previews: /pr/<N>/ servido a partir de /var/www/staging.sergioalmeida.dev/pr/<N>/
# Cada preview tem o seu próprio base path (Vite build com --base /pr/<N>/).

location ~ ^/pr/(\d+)$ {
    return 301 /pr/$1/;
}

location ^~ /pr/ {
    root /var/www/staging.sergioalmeida.dev;

    # HTML de previews nunca deve ficar em cache
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Security-Policy "upgrade-insecure-requests" always;

    # Assets estáticos de preview
    # Tolera pedidos que venham com barra no fim (ex: regras de trailing-slash da Cloudflare)
    location ~* ^/pr/\d+/assets/ {
        rewrite ^(/pr/\d+/assets/.+)/$ $1 break;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # SPA fallback: se for ficheiro real serve-o, senão cai no index.html do respetivo PR
    location ~ ^/pr/(\d+)/ {
        try_files $uri /pr/$1/index.html =404;
    }
}
