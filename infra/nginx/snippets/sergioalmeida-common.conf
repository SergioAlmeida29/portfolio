# Bloco partilhado entre produção e staging.
# Instalar em /etc/nginx/snippets/sergioalmeida-common.conf

index index.html;
server_tokens off;

# IP real do visitante (vem do túnel Cloudflare, não do localhost)
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;

# healthcheck para Cloudflare Health Checks
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# SPA: qualquer rota desconhecida cai no index.html (react-router)
location / {
    try_files $uri $uri/ /index.html;
}

# assets com hash no nome (Vite) -> cache longo e imutável
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# modelos 3D: .glb precisa do MIME certo (não está no mime.types do nginx)
location ~* \.glb$ {
    default_type model/gltf-binary;
    expires 30d;
    add_header Cache-Control "public";
}
location ~* \.(gltf|hdr|ktx2|draco|bin)$ {
    expires 30d;
    add_header Cache-Control "public";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
gzip_min_length 1024;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
