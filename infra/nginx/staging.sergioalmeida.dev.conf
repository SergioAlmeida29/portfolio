# /etc/nginx/sites-available/staging.sergioalmeida.dev  (STAGING)
# Protegido por Cloudflare Access; noindex para não aparecer no Google.

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name staging.sergioalmeida.dev;

    root /var/www/staging.sergioalmeida.dev/current;

    # nunca indexar staging
    add_header X-Robots-Tag "noindex, nofollow" always;

    include snippets/sergioalmeida-common.conf;

    access_log /var/log/nginx/staging.sergioalmeida.dev.access.log;
    error_log  /var/log/nginx/staging.sergioalmeida.dev.error.log;
}
