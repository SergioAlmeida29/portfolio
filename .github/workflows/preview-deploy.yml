name: preview-deploy

on:
  workflow_run:
    workflows: [deploy]
    types: [completed]

concurrency:
  group: preview-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.pull_requests[0].number != null
    runs-on: [self-hosted, linux]
    outputs:
      current: ${{ steps.check.outputs.current }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: obter build validado
        uses: actions/download-artifact@v5
        with:
          name: deploy-dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/preview-dist

      - name: verificar PR atual
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "numero de PR invalido: $PR" >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/preview-pr.json"
          if jq -e --arg sha "$HEAD_SHA" '.state == "open" and .head.sha == $sha' "$RUNNER_TEMP/preview-pr.json" >/dev/null; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "PR fechado ou build ultrapassado: $PR"
          fi

      - name: publicar preview atual
        if: steps.check.outputs.current == 'true'
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          DIST_DIR: ${{ runner.temp }}/preview-dist
        run: |
          bash infra/deploy-preview.sh "$PR"

      - name: testar resposta da preview
        if: steps.check.outputs.current == 'true'
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "numero de PR invalido: $PR" >&2; exit 1; }
          HOST="staging.sergioalmeida.dev"
          URL="http://127.0.0.1/pr/$PR"
          for i in $(seq 1 5); do
            CODE=$(curl -s -o "$RUNNER_TEMP/preview.html" -w '%{http_code}' "$URL/" -H "Host: $HOST" || true)
            [ "$CODE" = 200 ] && break
            sleep 1
          done
          [ "$CODE" = 200 ]
          grep -q 'id="root"' "$RUNNER_TEMP/preview.html"
          curl -sSI "$URL/" -H "Host: $HOST" | grep -iq 'x-robots-tag: noindex, nofollow'
          curl -sSI "$URL" -H "Host: $HOST" | grep -q '301'

          ASSETS="/var/www/staging.sergioalmeida.dev/pr/$PR/assets"
          CSS_FILE=$(find "$ASSETS" -maxdepth 1 -type f -name '*.css' -printf '%f\n' | head -1)
          JS_FILE=$(find "$ASSETS" -maxdepth 1 -type f -name '*.js' -printf '%f\n' | head -1)
          [ -n "$CSS_FILE" ] && [ -n "$JS_FILE" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/assets/$CSS_FILE" -H "Host: $HOST")" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/assets/$CSS_FILE/" -H "Host: $HOST")" = 200 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$URL/assets/$JS_FILE" -H "Host: $HOST")" = 200 ]

  comment:
    needs: preview
    if: needs.preview.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: comentar URL da preview no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "numero de PR invalido: $PR" >&2; exit 1; }
          URL="https://staging.sergioalmeida.dev/pr/$PR/"
          BODY="**Preview:** [$URL]($URL)"
          API="repos/$GITHUB_REPOSITORY/issues/$PR"
          COMMENT_ID=$(gh api "$API/comments?per_page=100" --jq '.[] | select(.body | startswith("**Preview:**")) | .id' | tail -1)
          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -X PATCH -f body="$BODY" >/dev/null
          else
            gh api "$API/comments" -X POST -f body="$BODY" >/dev/null
          fi
