name: deploy

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux]
    env:
      AMBIENTE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v5

      - name: instalar deps
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: |
          if [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            npm run build:staging
          else
            npm run build
          fi

      - name: deploy
        if: github.event_name == 'push'
        run: bash infra/deploy.sh "$AMBIENTE"

      # o build verde só diz que compila; isto diz que o site responde
      - name: smoke
        if: github.event_name == 'push'
        run: bash infra/smoke.sh "$AMBIENTE"
