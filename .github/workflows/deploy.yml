name: deploy

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar deps
        run: npm ci

      - name: recolher conteúdo
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/now.mjs

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: auditoria de dependências
        run: npm audit --audit-level=high

      - name: testar infraestrutura
        run: npm run test:infra

      - name: guardar conteúdo validado
        uses: actions/upload-artifact@v4
        with:
          name: site-content
          path: src/content/now.generated.ts
          if-no-files-found: error
          retention-days: 1

  build:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar deps
        run: npm ci

      - name: obter conteúdo validado
        uses: actions/download-artifact@v5
        with:
          name: site-content
          path: src/content/

      - name: instalar browsers de teste
        run: npx playwright install --with-deps chromium firefox webkit

      - name: build
        id: build
        run: |
          BASE="/"
          MODE="production"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR="${{ github.event.number }}"
            [[ "$PR" =~ ^[0-9]+$ ]] || { echo "numero de PR invalido: $PR" >&2; exit 1; }
            BASE="/pr/${PR}/"
            MODE="staging"
          elif [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            MODE="staging"
          fi
          npx vite build --mode "$MODE" --base "$BASE"
          if [ "$MODE" = "staging" ]; then node scripts/robots.mjs; fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: testar artifact do deploy
        timeout-minutes: 10
        env:
          SCREENSHOT_DIR: test-results/deploy
        run: node scripts/test-preview.mjs "${{ steps.build.outputs.base }}"

      - name: testar raiz e base alternativa
        if: github.event_name == 'pull_request'
        timeout-minutes: 10
        env:
          SCREENSHOT_DIR: test-results/root
        run: |
          npx vite build --mode staging --base / --outDir "$RUNNER_TEMP/portfolio-root"
          node scripts/test-preview.mjs / "$RUNNER_TEMP/portfolio-root"
          npx vite build --mode staging --base /portfolio/ --outDir "$RUNNER_TEMP/portfolio-base"
          node scripts/test-preview.mjs /portfolio/ "$RUNNER_TEMP/portfolio-base" scripts/check-ui-navigation.mjs

      - name: guardar resultados UI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: guardar artifact do deploy
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@v4
        with:
          name: deploy-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publicar:
    if: github.event_name == 'push'
    needs: build
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
    env:
      AMBIENTE: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: obter artifact do deploy
        uses: actions/download-artifact@v5
        with:
          name: deploy-dist
          path: dist/

      # mantém este job vermelho se a release nova ou o rollback falharem
      - name: deploy e smoke com rollback
        if: github.event_name == 'push'
        id: smoke
        run: bash infra/deploy-and-verify.sh "$AMBIENTE"
