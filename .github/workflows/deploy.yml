name: deploy

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: instalar deps
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/now.mjs && \
              npx vite build --mode staging --base "/pr/${{ github.event.number }}/" && \
              node scripts/robots.mjs
          elif [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            npm run build:staging
          else
            npm run build
          fi

      - name: deploy (push)
        if: github.event_name == 'push'
        run: bash infra/deploy.sh ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

      - name: deploy preview (pull_request)
        if: github.event_name == 'pull_request'
        run: bash infra/deploy-preview.sh ${{ github.event.number }}

      - name: testar resposta do nginx na preview
        if: github.event_name == 'pull_request'
        run: |
          PR="${{ github.event.number }}"
          echo "=== 1. Ficheiros em /var/www/staging.sergioalmeida.dev/pr/${PR}/assets/ ==="
          ls -la "/var/www/staging.sergioalmeida.dev/pr/${PR}/assets/"
          
          echo "=== 2. Testar CSS com curl (normal e com barra no fim) ==="
          CSS_FILE=$(ls "/var/www/staging.sergioalmeida.dev/pr/${PR}/assets/"*.css | head -1 | xargs -n1 basename)
          echo "--- CSS sem barra: ---"
          curl -s -i "http://127.0.0.1/pr/${PR}/assets/${CSS_FILE}" -H "Host: staging.sergioalmeida.dev" > /tmp/css_normal.txt
          head -n 12 /tmp/css_normal.txt
          grep -q "200 OK" /tmp/css_normal.txt || { echo "ERRO: CSS sem barra não devolveu 200"; exit 1; }
          
          echo "--- CSS com barra no fim: ---"
          curl -s -i "http://127.0.0.1/pr/${PR}/assets/${CSS_FILE}/" -H "Host: staging.sergioalmeida.dev" > /tmp/css_slash.txt
          head -n 12 /tmp/css_slash.txt
          grep -q "200 OK" /tmp/css_slash.txt || { echo "ERRO: CSS com barra não devolveu 200"; exit 1; }
          
          echo "=== 3. Testar Motion JS com curl (normal e com barra) ==="
          MOTION_FILE=$(ls "/var/www/staging.sergioalmeida.dev/pr/${PR}/assets/"motion-*.js 2>/dev/null | head -1 | xargs -n1 basename || echo "")
          if [ -n "$MOTION_FILE" ]; then
            echo "--- Motion JS sem barra: ---"
            curl -s -i "http://127.0.0.1/pr/${PR}/assets/${MOTION_FILE}" -H "Host: staging.sergioalmeida.dev" > /tmp/motion_normal.txt
            head -n 12 /tmp/motion_normal.txt
            grep -q "200 OK" /tmp/motion_normal.txt || { echo "ERRO: Motion JS sem barra não devolveu 200"; exit 1; }

            echo "--- Motion JS com barra: ---"
            curl -s -i "http://127.0.0.1/pr/${PR}/assets/${MOTION_FILE}/" -H "Host: staging.sergioalmeida.dev" > /tmp/motion_slash.txt
            head -n 12 /tmp/motion_slash.txt
            grep -q "200 OK" /tmp/motion_slash.txt || { echo "ERRO: Motion JS com barra não devolveu 200"; exit 1; }
          fi

          echo "=== 4. Testar redirecionamento de /pr/${PR} para /pr/${PR}/ ==="
          curl -s -i "http://127.0.0.1/pr/${PR}" -H "Host: staging.sergioalmeida.dev" > /tmp/pr_redir.txt
          head -n 12 /tmp/pr_redir.txt
          grep -q "301" /tmp/pr_redir.txt || { echo "ERRO: /pr/${PR} não deu 301"; exit 1; }
          if grep -qi "Location: http://" /tmp/pr_redir.txt; then
            echo "ERRO: Redirecionamento gerou URL absoluto com http://"
            exit 1
          fi

          echo "=== 5. Últimos acessos no Nginx ==="
          tail -n 25 /var/log/nginx/staging.sergioalmeida.dev.access.log 2>/dev/null || echo "sem access.log"
          
          echo "=== 6. Últimos erros no Nginx ==="
          tail -n 15 /var/log/nginx/staging.sergioalmeida.dev.error.log 2>/dev/null || echo "sem error.log"

      - name: comentar URL da preview no PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://staging.sergioalmeida.dev/pr/${PR}/"
          BODY="**Preview:** [${URL}](${URL})"
          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          COMMENT_ID=$(curl -fsSL -H "$AUTH" "${API}/issues/${PR}/comments?per_page=100" \
            | python3 -c "import json,sys; cs=json.load(sys.stdin); found=[c['id'] for c in cs if c['body'].startswith('**Preview:**')]; print(found[-1] if found else '')")
          if [ -n "$COMMENT_ID" ]; then
            curl -fsSL -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"body\":\"${BODY}\"}" "${API}/issues/comments/${COMMENT_ID}" > /dev/null
          else
            curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"body\":\"${BODY}\"}" "${API}/issues/${PR}/comments" > /dev/null
          fi
