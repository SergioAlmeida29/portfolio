name: deploy

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5

      - name: instalar deps
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: lint
        run: npm run lint

      - name: build
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            node scripts/now.mjs && \
              npx vite build --mode staging --base "/pr/${{ github.event.number }}/" && \
              node scripts/robots.mjs
          elif [ "$GITHUB_REF" = "refs/heads/dev" ]; then
            npm run build:staging
          else
            npm run build
          fi

      - name: deploy (push)
        if: github.event_name == 'push'
        run: bash infra/deploy.sh ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}

      - name: deploy preview (pull_request)
        if: github.event_name == 'pull_request'
        run: bash infra/deploy-preview.sh ${{ github.event.number }}

      - name: testar resposta do nginx na preview
        if: github.event_name == 'pull_request'
        run: |
          PR="${{ github.event.number }}"
          echo "=== 1. Testar /pr/${PR}/ ==="
          curl -s -i "http://127.0.0.1/pr/${PR}/" -H "Host: staging.sergioalmeida.dev" | head -n 30
          
          echo "=== 2. Encontrar caminhos de assets no index.html ==="
          cat "/var/www/staging.sergioalmeida.dev/pr/${PR}/index.html"
          
          JS_PATH=$(grep -o "/pr/${PR}/assets/[^\"']*\.js" "/var/www/staging.sergioalmeida.dev/pr/${PR}/index.html" | head -1)
          if [ -n "$JS_PATH" ]; then
            echo "=== 3. Testar JS ($JS_PATH) ==="
            curl -s -i "http://127.0.0.1${JS_PATH}" -H "Host: staging.sergioalmeida.dev" | head -n 20
          fi

      - name: comentar URL da preview no PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          URL="https://staging.sergioalmeida.dev/pr/${PR}/"
          BODY="**Preview:** [${URL}](${URL})"
          API="https://api.github.com/repos/${REPO}"
          AUTH="Authorization: Bearer ${GH_TOKEN}"
          COMMENT_ID=$(curl -fsSL -H "$AUTH" "${API}/issues/${PR}/comments?per_page=100" \
            | python3 -c "import json,sys; cs=json.load(sys.stdin); found=[c['id'] for c in cs if c['body'].startswith('**Preview:**')]; print(found[-1] if found else '')")
          if [ -n "$COMMENT_ID" ]; then
            curl -fsSL -X PATCH -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"body\":\"${BODY}\"}" "${API}/issues/comments/${COMMENT_ID}" > /dev/null
          else
            curl -fsSL -X POST -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"body\":\"${BODY}\"}" "${API}/issues/${PR}/comments" > /dev/null
          fi
